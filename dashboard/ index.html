<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 дней в движении — Точка Банк</title>
<style>
  :root{
    --bg: #10201a;
    --bg-alt: #16281f;
    --paper: #f4f2ea;
    --line: rgba(244,242,234,0.14);
    --gold: #f2b807;
    --coral: #ff6b4a;
    --mint: #7fd6b0;
    --text: #f4f2ea;
    --text-dim: rgba(244,242,234,0.62);
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    background: radial-gradient(circle at 15% 0%, var(--bg-alt), var(--bg) 60%);
    color: var(--text);
    font-family: var(--body);
    min-height:100vh;
    padding: 32px 20px 80px;
  }
  .wrap{ max-width: 980px; margin: 0 auto; }

  /* ---- header ---- */
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 10px;
  }
  h1{
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(42px, 8vw, 76px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .subtitle{ color: var(--text-dim); font-size: 15px; max-width: 520px; margin-bottom: 40px; }

  /* ---- route progress ---- */
  .route-card{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 26px 22px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .route-card::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.35;
    pointer-events:none;
  }
  .route-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 18px; position:relative;
  }
  .route-label{ font-family: var(--mono); font-size: 12px; text-transform:uppercase; letter-spacing:0.1em; color: var(--text-dim); }
  .route-pct{ font-family: var(--display); font-size: 34px; color: var(--gold); }
  .track{
    position:relative;
    height: 14px;
    background: rgba(244,242,234,0.08);
    border-radius: 999px;
    overflow: visible;
  }
  .track-fill{
    position:absolute; top:0; left:0; height:100%;
    background: linear-gradient(90deg, var(--mint), var(--gold));
    border-radius: 999px;
    transition: width 1s ease;
  }
  .track-marker{
    position:absolute; top:50%; transform: translate(-50%,-50%);
    font-size: 20px;
  }
  .route-foot{ display:flex; justify-content:space-between; margin-top: 10px; font-family: var(--mono); font-size:12px; color: var(--text-dim); }

  /* ---- KPI grid ---- */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  @media (max-width: 720px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
  .tile{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px 16px;
  }
  .tile-label{ font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 8px; }
  .tile-value{ font-family: var(--display); font-size: 34px; line-height:1; color: var(--text); }
  .tile-value span{ color: var(--gold); }

  /* ---- leaderboard ---- */
  .board{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 26px 8px;
  }
  .board-title{ font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: 0.01em; margin-bottom: 14px; }
  table{ width:100%; border-collapse: collapse; }
  th{
    text-align:left; font-family: var(--mono); font-size: 11px; text-transform:uppercase;
    color: var(--text-dim); letter-spacing: 0.06em; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  td{ padding: 12px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
  td:first-child, th:first-child{ font-family: var(--mono); color: var(--gold); width: 34px; }
  .name{ font-weight: 600; }
  .city-tag{ color: var(--text-dim); font-size: 12px; }
  .points{ font-family: var(--mono); text-align:right; color: var(--mint); }
  tr:last-child td{ border-bottom:none; }

  .updated{ text-align:center; font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Точка Банк · Спортивный движ</div>
  <h1>30 дней<br>в движении</h1>
  <p class="subtitle">Совместный маршрут команды: каждый шаг, каждая тренировка и каждая совместная пробежка приближают нас к общей цели.</p>

  <div class="route-card">
    <div class="route-head">
      <div class="route-label">Общий маршрут</div>
      <div class="route-pct" id="pct">—%</div>
    </div>
    <div class="track">
      <div class="track-fill" id="fill" style="width:0%"></div>
      <div class="track-marker" id="marker" style="left:0%">🏃</div>
    </div>
    <div class="route-foot">
      <span id="pointsNow">0 баллов</span>
      <span id="pointsGoal">Цель: 0 баллов</span>
    </div>
  </div>

  <div class="grid">
    <div class="tile">
      <div class="tile-label">Шаги</div>
      <div class="tile-value" id="totalSteps">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">Часы тренировок</div>
      <div class="tile-value" id="totalHours">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">Города</div>
      <div class="tile-value" id="totalCities">—</div>
    </div>
    <div class="tile">
      <div class="tile-label">Участники</div>
      <div class="tile-value" id="totalParticipants">—</div>
    </div>
  </div>

  <div class="board">
    <div class="board-title">Топ команды</div>
    <table>
      <thead>
        <tr><th>#</th><th>Участник</th><th style="text-align:right">Баллы</th></tr>
      </thead>
      <tbody id="leaderboard"></tbody>
    </table>
  </div>

  <div class="updated" id="updated"></div>

</div>

<script>
  // ==== Настройки ====
  const STATS_URL = "https://move-challenge-bot.egorv28.workers.dev/stats"; // замени на свой Worker URL
  const GOAL_POINTS = 100000000000000000000000; // общая цель по баллам — подставь свою

  async function loadStats() {
    let data;
    try {
      const res = await fetch(STATS_URL);
      data = await res.json();
    } catch (e) {
      // демо-данные, если Worker ещё не подключен
      data = {
        total_points: 0, total_steps: 0, total_hours: 0,
        participants: 0, cities_count: 0, leaderboard: [], updated_at: null
      };
    }
    render(data);
  }

  function render(data) {
    const pct = Math.min(100, Math.round((data.total_points / GOAL_POINTS) * 1000) / 10);
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('marker').style.left = pct + '%';
    document.getElementById('pointsNow').textContent = data.total_points.toLocaleString('ru-RU') + ' баллов';
    document.getElementById('pointsGoal').textContent = 'Цель: ' + GOAL_POINTS.toLocaleString('ru-RU') + ' баллов';

    document.getElementById('totalSteps').innerHTML = data.total_steps.toLocaleString('ru-RU');
    document.getElementById('totalHours').innerHTML = data.total_hours.toLocaleString('ru-RU');
    document.getElementById('totalCities').innerHTML = data.cities_count;
    document.getElementById('totalParticipants').innerHTML = data.participants;

    const tbody = document.getElementById('leaderboard');
    tbody.innerHTML = '';
    (data.leaderboard || []).forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = \`
        <td>\${i + 1}</td>
        <td><div class="name">\${row.full_name || row.username || 'Участник'}</div><div class="city-tag">\${row.city || ''}</div></td>
        <td class="points">\${row.points.toLocaleString('ru-RU')}</td>
      \`;
      tbody.appendChild(tr);
    });

    document.getElementById('updated').textContent = data.updated_at
      ? 'Обновлено: ' + new Date(data.updated_at).toLocaleString('ru-RU')
      : 'Ожидание подключения бота…';
  }

  loadStats();
  setInterval(loadStats, 60000); // обновление раз в минуту
</script>
</body>
</html>
